name: Novelight Pagination Test

on:
  pull_request:
    branches: [master]
    paths:
      - plugins/english/novelight.ts
      - scripts/novelight-pagination.test.mjs
      - .github/workflows/novelight-pagination-test.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  novelight-pagination:
    name: Novelight Pagination Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pagination Regression Check
        run: node --test scripts/novelight-pagination.test.mjs

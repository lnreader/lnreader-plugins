name: GitHub Scripts & Templates Check

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate GitHub Scripts & YAML
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Run GitHub Script Tests
        run: node --test .github/scripts/*.test.cjs

      - name: Validate GitHub YAML Files
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          paths = sorted(
              glob.glob('.github/workflows/*.yml')
              + glob.glob('.github/ISSUE_TEMPLATE/*.yml')
              + ['.github/scripts/blank_report_issue.yml']
          )

          failed = False
          for path in paths:
              try:
                  with open(path, encoding='utf-8') as fh:
                      content = fh.read()
                  if path == '.github/scripts/blank_report_issue.yml':
                      content = content.replace('{#CHANGE#}', '- "English: Example"')
                  yaml.safe_load(content)
              except Exception as exc:
                  print(f'Invalid YAML in {path}: {exc}', file=sys.stderr)
                  failed = True

          if failed:
              sys.exit(1)
          print(f'Validated {len(paths)} YAML files.')
          PY

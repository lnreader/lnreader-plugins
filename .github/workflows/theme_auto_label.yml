name: Auto Theme Labeler

on:
  issues:
    types: [labeled, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-label:
    name: Auto Label Theme
    if: >-
      ${{
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'plugin request') &&
        (github.event.action != 'labeled' || github.event.label.name == 'plugin request')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Extract Website URL
        id: get_url
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          node .github/scripts/check-plugin-request-site.cjs --extract-url > "$RUNNER_TEMP/url.json"
          URL=$(jq -r '.url' "$RUNNER_TEMP/url.json")
          BASE_URL=$(jq -r '.baseUrl' "$RUNNER_TEMP/url.json")
          {
            echo "URL<<EOF_URL"
            printf '%s\n' "$URL"
            echo "EOF_URL"
            echo "BASE_URL=$BASE_URL"
          } >> "$GITHUB_OUTPUT"
          echo "Using URL: \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Using Base URL: \`$BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Get User Agent
        id: get_user_agent
        if: steps.get_url.outputs.BASE_URL != ''
        run: |
          CHROME_VERSION=$(curl --silent --max-time 10 'https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Windows&num=1' | jq -r '.[0].version // empty' || true)
          CHROME_VERSION="${CHROME_VERSION:-126.0.6478.36}"
          echo "USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/$CHROME_VERSION Safari/537.36" >> "$GITHUB_OUTPUT"

      - name: Check Website Reachability
        id: check_site
        if: always() && !cancelled() && steps.get_url.outputs.BASE_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PREVIOUS_ISSUE_BODY_JSON: ${{ toJSON(github.event.changes.body.from) }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          USER_AGENT: ${{ steps.get_user_agent.outputs.USER_AGENT }}
        run: |
          set -euo pipefail
          node .github/scripts/check-plugin-request-site.cjs > "$RUNNER_TEMP/site-check.json"
          REACHABLE=$(jq -r '.reachable' "$RUNNER_TEMP/site-check.json")
          STATUS=$(jq -r '.reachability.status // "unknown"' "$RUNNER_TEMP/site-check.json")
          SHOULD_CLOSE=$(jq -r '.shouldClose' "$RUNNER_TEMP/site-check.json")
          SKIPPED=$(jq -r '.skipped // ""' "$RUNNER_TEMP/site-check.json")
          FAILURE_REASON=$(jq -r '.reachability.failureReason // ""' "$RUNNER_TEMP/site-check.json")

          echo "## Website Reachability Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: \`$STATUS\` (reachable: \`$REACHABLE\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAILURE_REASON" ]; then
            echo "- Reason: $FAILURE_REASON" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$SKIPPED" ]; then
            echo "- Auto-close skipped: \`$SKIPPED\`" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SHOULD_CLOSE" = "true" ]; then
            gh api "repos/$REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/current-issue.json"
            node .github/scripts/check-plugin-request-site.cjs --confirm-close "$RUNNER_TEMP/site-check.json" "$RUNNER_TEMP/current-issue.json" > "$RUNNER_TEMP/close-decision.json"
            if [ "$(jq -r '.shouldClose' "$RUNNER_TEMP/close-decision.json")" = "true" ]; then
              jq -n '{labels: ["invalid"]}' \
                | gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/labels" --input - >/dev/null
              jq '{body: .comment}' "$RUNNER_TEMP/close-decision.json" \
                | gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" --input - >/dev/null
              gh api --method PATCH "repos/$REPO/issues/$ISSUE_NUMBER" \
                -f state=closed \
                -f state_reason=not_planned >/dev/null
              echo "- Action: Added \`invalid\` label and closed issue as \`not_planned\`." >> "$GITHUB_STEP_SUMMARY"
            else
              CONFIRM_SKIPPED=$(jq -r '.skipped // "unknown"' "$RUNNER_TEMP/close-decision.json")
              echo "- Action: Skipped closing after live issue recheck (\`$CONFIRM_SKIPPED\`)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo "reachable=$REACHABLE"
            echo "status=$STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Detect Website Theme
        id: detect_theme
        if: steps.get_url.outputs.BASE_URL != '' && steps.check_site.outputs.reachable == 'true'
        env:
          BASE_URL: ${{ steps.get_url.outputs.BASE_URL }}
          USER_AGENT: ${{ steps.get_user_agent.outputs.USER_AGENT }}
        run: |
          is_private_ip() {
            local ip="${1,,}"
            ip="${ip#\[}"
            ip="${ip%\]}"
            ip="${ip%%%*}"
            [[ -z "$ip" ]] && return 0
            if [[ "$ip" == *:* ]]; then
              [[ "$ip" == "::" || "$ip" == "::1" || "$ip" == 0:0:0:0:0:0:0:[01] || "$ip" == fc* || "$ip" == fd* || "$ip" == fe[89ab]* || "$ip" == ::ffff:* ]]
              return $?
            fi
            local o1 o2 _o3 _o4
            IFS=. read -r o1 o2 _o3 _o4 <<< "$ip"
            [[ "$o1" =~ ^[0-9]+$ && "$o2" =~ ^[0-9]+$ ]] || return 0
            (( o1 == 0 || o1 == 10 || o1 == 127 )) && return 0
            (( o1 == 169 && o2 == 254 )) && return 0
            (( o1 == 172 && o2 >= 16 && o2 <= 31 )) && return 0
            (( o1 == 192 && o2 == 168 )) && return 0
            (( o1 == 100 && o2 >= 64 && o2 <= 127 )) && return 0
            return 1
          }

          check_head() {
            local url="$1" expected_ct="$2" meta code ctype remote_ip
            meta=$(curl --location --max-redirs 5 --proto '=http,https' --proto-redir '=http,https' --output /dev/null --silent --head --max-time 10 -w '%{http_code}\t%{content_type}\t%{remote_ip}' "$url" -H "User-Agent: $USER_AGENT" 2>/dev/null || true)
            IFS=$'\t' read -r code ctype remote_ip <<< "$meta"
            ctype=$(printf '%s' "$ctype" | tr '[:upper:]' '[:lower:]')
            ! is_private_ip "$remote_ip" && [[ "$code" == "200" && "$ctype" == *"$expected_ct"* ]]
          }

          fetch_and_grep() {
            local url="$1" pattern="$2" out_file="$3" remote_ip
            rm -f "$out_file"
            remote_ip=$(curl --location --max-redirs 5 --proto '=http,https' --proto-redir '=http,https' --silent --fail --max-time 10 --max-filesize 2097152 -w '%{remote_ip}' -o "$out_file" "$url" -H "User-Agent: $USER_AGENT" 2>/dev/null) || return 1
            ! is_private_ip "$remote_ip" && grep -q "$pattern" "$out_file"
          }

          MATCHED=()

          run_probe() {
            local name="$1" label="$2" fn="$3" host="$4"
            shift 4
            echo "🔍 Checking for $name theme..." >> "$GITHUB_STEP_SUMMARY"
            if "$fn" "https://$host" "$@" || "$fn" "http://$host" "$@"; then
              MATCHED+=("$label")
              echo "✅ $name Theme Detected" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $name Theme Not Found" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          probe_head_url() {
            local base="$1" path="$2" expected_ct="$3"
            check_head "$base$path" "$expected_ct"
          }

          probe_body_url() {
            local base="$1" path="$2" pattern="$3" out_file="$4"
            fetch_and_grep "$base$path" "$pattern" "$out_file"
          }

          run_probe "Madara" "theme: madara" probe_head_url "$BASE_URL" "/wp-content/themes/madara/style.css" "text/css"
          run_probe "Lightnovelwp" "theme: lightnovelwp" probe_head_url "$BASE_URL" "/wp-content/themes/lightnovel/style.css" "text/css"
          run_probe "HotNovelPub" "theme: hotnovelpub" probe_body_url "api.$BASE_URL" "" "Hello!" "$RUNNER_TEMP/hotnovelpub.txt"
          run_probe "Fictioneer" "theme: fictioneer" probe_head_url "$BASE_URL" "/wp-content/themes/fictioneer/css/application.css" "text/css"
          run_probe "Novel Fire" "theme: novel fire" probe_head_url "$BASE_URL" "/frontend/js/appsettings.min.js" "javascript"
          run_probe "Readwn" "theme: readwn" probe_body_url "$BASE_URL" "/list/all/all-newstime-0.html" "novel-item" "$RUNNER_TEMP/readwn.html"

          {
            echo "match_count=${#MATCHED[@]}"
            echo "theme_label=${MATCHED[0]:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Add Theme Label To Issue
        id: add_theme_label
        if: steps.get_url.outputs.BASE_URL != '' && steps.check_site.outputs.reachable == 'true' && steps.detect_theme.outcome == 'success'
        env:
          MATCH_COUNT: ${{ steps.detect_theme.outputs.match_count }}
          THEME_LABEL: ${{ steps.detect_theme.outputs.theme_label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Theme Detection Result" >> "$GITHUB_STEP_SUMMARY"
          if (( MATCH_COUNT > 1 )); then
            echo "⚠️ Multiple themes detected ($MATCH_COUNT)." >> "$GITHUB_STEP_SUMMARY"
          elif (( MATCH_COUNT == 1 )) && [ -n "$THEME_LABEL" ]; then
            if [ "$THEME_LABEL" = "theme: lightnovelwp" ]; then
              if ! gh api "repos/$REPO/labels/theme%3A%20lightnovelwp" >/dev/null 2>&1; then
                if gh api "repos/$REPO/labels/theme%3A%20lighnovelwp" >/dev/null 2>&1; then
                  THEME_LABEL="theme: lighnovelwp"
                else
                  gh api --method POST "repos/$REPO/labels" \
                    -f "name=theme: lightnovelwp" \
                    -f "color=D4C5F9" \
                    -f "description=Site uses Lightnovelwp theme" >/dev/null 2>&1 || true
                fi
              fi
            fi
            echo "🏷️ Adding label: $THEME_LABEL" >> "$GITHUB_STEP_SUMMARY"
            jq -n --arg label "$THEME_LABEL" '{labels: [$label]}' \
              | gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/labels" --input -
          else
            echo "❌ No Theme Detected" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Auto Theme Labeler

on:
  issues:
    types: [labeled, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-label:
    name: Auto Label Theme
    if: >-
      ${{
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'plugin request') &&
        (github.event.action != 'labeled' || github.event.label.name == 'plugin request')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Extract Website URL
        id: get_url
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          node .github/scripts/check-plugin-request-site.cjs --extract-url > "$RUNNER_TEMP/url.json"
          URL=$(jq -r '.url' "$RUNNER_TEMP/url.json")
          BASE_URL=$(jq -r '.baseUrl' "$RUNNER_TEMP/url.json")
          {
            echo "URL<<EOF_URL"
            printf '%s\n' "$URL"
            echo "EOF_URL"
            echo "BASE_URL=$BASE_URL"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Using URL: \`$URL\`"
            echo "Using Base URL: \`$BASE_URL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Website Reachability
        id: check_site
        if: always() && !cancelled() && steps.get_url.outputs.BASE_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PREVIOUS_ISSUE_BODY_JSON: ${{ toJSON(github.event.changes.body.from) }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          ISSUE_STATE: ${{ github.event.issue.state }}
        run: |
          set -euo pipefail
          node .github/scripts/check-plugin-request-site.cjs > "$RUNNER_TEMP/site-check.json"
          REACHABLE=$(jq -r '.reachable' "$RUNNER_TEMP/site-check.json")
          STATUS=$(jq -r '.reachability.status // "unknown"' "$RUNNER_TEMP/site-check.json")
          SHOULD_CLOSE=$(jq -r '.shouldClose' "$RUNNER_TEMP/site-check.json")
          SKIPPED=$(jq -r '.skipped // ""' "$RUNNER_TEMP/site-check.json")
          FAILURE_REASON=$(jq -r '.reachability.failureReason // ""' "$RUNNER_TEMP/site-check.json")

          {
            echo "## Website Reachability Check"
            echo "- Status: \`$STATUS\` (reachable: \`$REACHABLE\`)"
            if [ -n "$FAILURE_REASON" ]; then
              echo "- Reason: $FAILURE_REASON"
            fi
            if [ -n "$SKIPPED" ]; then
              echo "- Auto-close skipped: \`$SKIPPED\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SHOULD_CLOSE" = "true" ]; then
            gh api "repos/$REPO/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/current-issue.json"
            node .github/scripts/check-plugin-request-site.cjs --confirm-close "$RUNNER_TEMP/site-check.json" "$RUNNER_TEMP/current-issue.json" > "$RUNNER_TEMP/close-decision.json"
            if [ "$(jq -r '.shouldClose' "$RUNNER_TEMP/close-decision.json")" = "true" ]; then
              node .github/scripts/close-invalid-issue.cjs "$RUNNER_TEMP/close-decision.json" >/dev/null
              echo "- Action: Added \`invalid\` label and closed issue as \`not_planned\`." >> "$GITHUB_STEP_SUMMARY"
            else
              CONFIRM_SKIPPED=$(jq -r '.skipped // "unknown"' "$RUNNER_TEMP/close-decision.json")
              echo "- Action: Skipped closing after live issue recheck (\`$CONFIRM_SKIPPED\`)." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          {
            echo "reachable=$REACHABLE"
            echo "status=$STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Detect Website Theme
        id: detect_theme
        if: steps.get_url.outputs.BASE_URL != '' && steps.check_site.outputs.reachable == 'true'
        env:
          BASE_URL: ${{ steps.get_url.outputs.BASE_URL }}
        run: |
          set -euo pipefail
          node .github/scripts/check-plugin-request-site.cjs --detect-theme > "$RUNNER_TEMP/theme-detect.json"
          MATCH_COUNT=$(jq -r '.matchCount' "$RUNNER_TEMP/theme-detect.json")
          THEME_LABEL=$(jq -r '.themeLabel' "$RUNNER_TEMP/theme-detect.json")

          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.checks[] | "🔍 Checking for \(.name) theme...\n" + (if .detected then "✅ \(.name) Theme Detected" else "❌ \(.name) Theme Not Found" end)' "$RUNNER_TEMP/theme-detect.json")

          {
            echo "match_count=$MATCH_COUNT"
            echo "theme_label=$THEME_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Add Theme Label To Issue
        id: add_theme_label
        if: steps.get_url.outputs.BASE_URL != '' && steps.check_site.outputs.reachable == 'true' && steps.detect_theme.outcome == 'success'
        env:
          MATCH_COUNT: ${{ steps.detect_theme.outputs.match_count }}
          THEME_LABEL: ${{ steps.detect_theme.outputs.theme_label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "## Theme Detection Result" >> "$GITHUB_STEP_SUMMARY"

          RESOLVED_THEME_LABEL=""
          if (( MATCH_COUNT > 1 )); then
            echo "⚠️ Multiple themes detected ($MATCH_COUNT)." >> "$GITHUB_STEP_SUMMARY"
          elif (( MATCH_COUNT == 1 )) && [ -n "$THEME_LABEL" ]; then
            RESOLVED_THEME_LABEL="$THEME_LABEL"
            if [ "$RESOLVED_THEME_LABEL" = "theme: lightnovelwp" ]; then
              if ! gh api "repos/$REPO/labels/theme%3A%20lightnovelwp" >/dev/null 2>&1; then
                if gh api "repos/$REPO/labels/theme%3A%20lighnovelwp" >/dev/null 2>&1; then
                  RESOLVED_THEME_LABEL="theme: lighnovelwp"
                else
                  gh api --method POST "repos/$REPO/labels" \
                    -f "name=theme: lightnovelwp" \
                    -f "color=D4C5F9" \
                    -f "description=Site uses Lightnovelwp theme" >/dev/null 2>&1 || true
                fi
              fi
            fi
          else
            echo "❌ No Theme Detected" >> "$GITHUB_STEP_SUMMARY"
          fi

          gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '[.labels[].name]' > "$RUNNER_TEMP/live-labels.json"
          RESOLVED_THEME_LABEL="$RESOLVED_THEME_LABEL" node .github/scripts/check-plugin-request-site.cjs --plan-theme-labels "$RUNNER_TEMP/theme-detect.json" "$RUNNER_TEMP/live-labels.json" > "$RUNNER_TEMP/theme-label-plan.json"

          if [ "$(jq '.add | length' "$RUNNER_TEMP/theme-label-plan.json")" -gt 0 ]; then
            ADDED=$(jq -r '.add | join(", ")' "$RUNNER_TEMP/theme-label-plan.json")
            echo "🏷️ Adding label: $ADDED" >> "$GITHUB_STEP_SUMMARY"
            jq '{labels: .add}' "$RUNNER_TEMP/theme-label-plan.json" \
              | gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/labels" --input - >/dev/null
          elif [ -n "$RESOLVED_THEME_LABEL" ]; then
            echo "🏷️ Label already present: $RESOLVED_THEME_LABEL" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$(jq '.remove | length' "$RUNNER_TEMP/theme-label-plan.json")" -gt 0 ]; then
            while IFS= read -r old_label; do
              [ -n "$old_label" ] || continue
              encoded=$(jq -rn --arg l "$old_label" '$l | @uri')
              gh api --method DELETE "repos/$REPO/issues/$ISSUE_NUMBER/labels/$encoded" >/dev/null 2>&1 || true
              echo "🧹 Removed stale label: $old_label" >> "$GITHUB_STEP_SUMMARY"
            done < <(jq -r '.remove[]' "$RUNNER_TEMP/theme-label-plan.json")
          fi

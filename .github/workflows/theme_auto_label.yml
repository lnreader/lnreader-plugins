name: Auto Theme Labeler

on:
  issues:
    types: [labeled, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-label:
    name: Auto Label Theme
    if: >-
      ${{
        contains(github.event.issue.labels.*.name, 'plugin request') &&
        (github.event.action != 'labeled' || github.event.label.name == 'plugin request')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Get Plugin Website URL
        id: get_url
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          URL=$(printf '%s\n' "$ISSUE_BODY" | tr -d '\r' | awk '/### Website URL/ {f=1; next} f && /^### / {exit} f && NF {print; exit}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ "$URL" = "_No response_" ]; then
            URL=""
          fi
          echo "URL=$URL" >> "$GITHUB_OUTPUT"
          echo "Using URL: \`$URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Get Base URL
        id: get_base_url
        env:
          URL: ${{ steps.get_url.outputs.URL }}
        run: |
          BASE_URL=$(printf '%s' "$URL" | sed -E 's#^[Hh][Tt][Tt][Pp][Ss]?://##; s#[/?#].*$##')
          if [[ ! "$BASE_URL" =~ ^[A-Za-z0-9.-]+\.([A-Za-z]{2,}|xn--[A-Za-z0-9-]{2,})(:[0-9]+)?$ ]]; then
            BASE_URL=""
          else
            HOST_ONLY=$(printf '%s' "${BASE_URL%%:*}" | tr '[:upper:]' '[:lower:]')
            if [[ "$HOST_ONLY" == "localhost" || "$HOST_ONLY" == *.localhost || "$HOST_ONLY" == *.local || "$HOST_ONLY" == *.internal ]]; then
              BASE_URL=""
            fi
          fi
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "Using Base URL: \`$BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Get User Agent
        id: get_user_agent
        if: steps.get_base_url.outputs.BASE_URL != ''
        run: |
          CHROME_VERSION=$(curl --silent --max-time 10 'https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Windows&num=1' | jq -r '.[0].version // empty' || true)
          CHROME_VERSION="${CHROME_VERSION:-126.0.6478.36}"
          echo "USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/$CHROME_VERSION Safari/537.36" >> "$GITHUB_OUTPUT"

      - name: Detect Website Theme
        id: detect_theme
        if: always() && !cancelled() && steps.get_base_url.outputs.BASE_URL != ''
        env:
          BASE_URL: ${{ steps.get_base_url.outputs.BASE_URL }}
          USER_AGENT: ${{ steps.get_user_agent.outputs.USER_AGENT }}
        run: |
          check_head() {
            local url="$1" expected_ct="$2" meta code ctype
            meta=$(curl --location --max-redirs 5 --output /dev/null --silent --head --max-time 10 -w '%{http_code}\t%{content_type}' "$url" -H "User-Agent: $USER_AGENT" 2>/dev/null || true)
            IFS=$'\t' read -r code ctype <<< "$meta"
            ctype=$(printf '%s' "$ctype" | tr '[:upper:]' '[:lower:]')
            [[ "$code" == "200" && "$ctype" == *"$expected_ct"* ]]
          }

          fetch_and_grep() {
            local url="$1" pattern="$2" out_file="$3"
            rm -f "$out_file"
            if curl --location --max-redirs 5 --silent --fail --max-time 10 --max-filesize 2097152 -o "$out_file" "$url" -H "User-Agent: $USER_AGENT" 2>/dev/null; then
              grep -q "$pattern" "$out_file"
              return $?
            fi
            return 1
          }

          MATCHED=()

          probe_head() {
            local name="$1" label="$2" path="$3" expected_ct="$4"
            echo "🔍 Checking for $name theme..." >> "$GITHUB_STEP_SUMMARY"
            if check_head "https://$BASE_URL$path" "$expected_ct" || \
               check_head "http://$BASE_URL$path" "$expected_ct"; then
              MATCHED+=("$label")
              echo "✅ $name Theme Detected" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $name Theme Not Found" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          probe_body() {
            local name="$1" label="$2" host="$3" path="$4" pattern="$5" out_file="$6"
            echo "🔍 Checking for $name theme..." >> "$GITHUB_STEP_SUMMARY"
            if fetch_and_grep "https://$host$path" "$pattern" "$out_file" || \
               fetch_and_grep "http://$host$path" "$pattern" "$out_file"; then
              MATCHED+=("$label")
              echo "✅ $name Theme Detected" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $name Theme Not Found" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          probe_head "Madara" "theme: madara" "/wp-content/themes/madara/style.css" "text/css"
          probe_head "Lightnovelwp" "theme: lightnovelwp" "/wp-content/themes/lightnovel/style.css" "text/css"
          probe_body "HotNovelPub" "theme: hotnovelpub" "api.$BASE_URL" "" "Hello!" "$RUNNER_TEMP/hotnovelpub.txt"
          probe_head "Fictioneer" "theme: fictioneer" "/wp-content/themes/fictioneer/css/application.css" "text/css"
          probe_head "Novel Fire" "theme: novel fire" "/frontend/js/appsettings.min.js" "javascript"
          probe_body "Readwn" "theme: readwn" "$BASE_URL" "/list/all/all-newstime-0.html" "novel-item" "$RUNNER_TEMP/readwn.html"

          {
            echo "match_count=${#MATCHED[@]}"
            echo "theme_label=${MATCHED[0]:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Add Theme Label To Issue
        id: add_theme_label
        if: always() && !cancelled() && steps.get_base_url.outputs.BASE_URL != ''
        env:
          MATCH_COUNT: ${{ steps.detect_theme.outputs.match_count }}
          THEME_LABEL: ${{ steps.detect_theme.outputs.theme_label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Theme Detection Result" >> "$GITHUB_STEP_SUMMARY"
          if (( MATCH_COUNT > 1 )); then
            echo "⚠️ Multiple themes detected ($MATCH_COUNT)." >> "$GITHUB_STEP_SUMMARY"
          elif (( MATCH_COUNT == 1 )) && [ -n "$THEME_LABEL" ]; then
            if [ "$THEME_LABEL" = "theme: lightnovelwp" ]; then
              if ! gh api "repos/$REPO/labels/theme%3A%20lightnovelwp" >/dev/null 2>&1; then
                if gh api "repos/$REPO/labels/theme%3A%20lighnovelwp" >/dev/null 2>&1; then
                  THEME_LABEL="theme: lighnovelwp"
                else
                  gh api --method POST "repos/$REPO/labels" \
                    -f "name=theme: lightnovelwp" \
                    -f "color=D4C5F9" \
                    -f "description=Site uses Lightnovelwp theme" >/dev/null 2>&1 || true
                fi
              fi
            fi
            echo "🏷️ Adding label: $THEME_LABEL" >> "$GITHUB_STEP_SUMMARY"
            jq -n --arg label "$THEME_LABEL" '{labels: [$label]}' \
              | gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/labels" --input -
          else
            echo "❌ No Theme Detected" >> "$GITHUB_STEP_SUMMARY"
          fi

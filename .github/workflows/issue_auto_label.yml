name: Auto Label Issues

on:
  issues:
    types:
      - opened
      - edited

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-label:
    name: Auto Label Issues
    if: >-
      ${{ github.event.issue.body && (
        (contains(github.event.issue.labels.*.name, 'bug') && contains(github.event.issue.body, '### Plugin')) ||
        (contains(github.event.issue.labels.*.name, 'plugin request') && contains(github.event.issue.body, '### Language'))
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Determine Labels
        id: determine-labels
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          node .github/scripts/auto-label-issue.cjs > "$RUNNER_TEMP/labels.json"
          COUNT=$(jq '.labels | length' "$RUNNER_TEMP/labels.json")
          echo "label_count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Add Labels To Issue
        if: steps.determine-labels.outputs.label_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          while IFS= read -r label; do
            [ -n "$label" ] || continue
            gh api --method POST "repos/$REPOSITORY/labels" -f "name=$label" -f "color=ADD8E6" >/dev/null 2>&1 || true
          done < <(jq -r '.labels[] | select(startswith("language: "))' "$RUNNER_TEMP/labels.json")
          gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/labels" --input "$RUNNER_TEMP/labels.json"

      - name: Log No Matching Labels
        if: steps.determine-labels.outputs.label_count == '0'
        run: echo "No matching labels found for the issue."
